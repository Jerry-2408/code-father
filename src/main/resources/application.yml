spring:
  application:
    name: example.code-father
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/code_father
    username: root
    password: 123456
  profiles:
    active: local
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
      database: 0
  # spring-session
  session:
    store-type: redis
    timeout: 2592000
server:
  port: 8123
  servlet:
    context-path: /api
    # servlet-session
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.example.codefather.controller

# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: ${deepseek.api-key}
      model-name: deepseek-chat
      log-requests: true
      log-responses: true
      max-tokens: 8192
      max-retries: 2
    #      response-format: json_object
#      strict-json-schema: true
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${deepseek.api-key}
      model-name: deepseek-chat
      max-tokens: 8192
      log-requests: true
      log-responses: true
      temperature: 0.1
    reasoning-streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${deepseek.api-key}
      model-name: deepseek-reasoner
      max-tokens: 32768
      log-requests: true
      log-responses: true
      temperature: 0.1
    routing-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${deepseek.api-key}
      model-name: deepseek-chat
      max-tokens: 8192
      log-requests: true
      log-responses: true
      max-retries: 3
# COS对象存储配置
cos:
  client:
    host: ${tencent.host}
    secretId: ${tencent.secretId}
    secretKey: ${tencent.secretKey}
    region: ${tencent.region}
    bucket: ${tencent.bucket}
# pexels配置
pexels:
  api-key: ${pexels.api-key}
# 阿里云 DashScope 配置
dashscope:
  api-key: ${dashscope.api-key}
  image-model: wan2.2-t2i-flash
